name: Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build
        run: |
          go build -v -trimpath -ldflags '-s -w' ./cmd/shadowsocks-go
          go build -v -trimpath -ldflags '-s -w' ./cmd/shadowsocks-go-domain-set-converter

      - name: Test
        run: go test -v ./...

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: shadowsocks-go-${{ github.sha }}-linux-${{ runner.arch }}
          path: shadowsocks-go*
