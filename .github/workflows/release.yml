name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sshappy_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --password=test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify release commit
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Verify MySQL 8.4 migration and accounting
        env:
          SSHAPPY_TEST_MYSQL_DSN: root:test-password@tcp(127.0.0.1:3306)/sshappy_test?parseTime=true
        run: go test -count=1 -v ./internal/panel -run '^TestMySQL'

      - name: Build
        run: |
          sstest_ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir package-linux-glibc-x86-64-v2 \
                package-linux-glibc-x86-64-v3 \
                package-linux-x86-64-v2 \
                package-linux-x86-64-v3 \
                package-linux-arm64

          env GOAMD64=v2 go build -v -trimpath -ldflags '-s -w' -o package-linux-glibc-x86-64-v2/ ./cmd/shadowsocks-go
          env GOAMD64=v3 go build -v -trimpath -ldflags '-s -w' -o package-linux-glibc-x86-64-v3/ ./cmd/shadowsocks-go
          env CGO_ENABLED=0 GOAMD64=v2 go build -v -trimpath -ldflags '-s -w' -o package-linux-x86-64-v2/ ./cmd/shadowsocks-go
          env CGO_ENABLED=0 GOAMD64=v3 go build -v -trimpath -ldflags '-s -w' -o package-linux-x86-64-v3/ ./cmd/shadowsocks-go
          env CGO_ENABLED=0 GOARCH=arm64 go build -v -trimpath -ldflags '-s -w' -o package-linux-arm64/ ./cmd/shadowsocks-go

          env GOAMD64=v2 go build -v -trimpath -ldflags '-s -w' -o package-linux-glibc-x86-64-v2/ ./cmd/shadowsocks-go-domain-set-converter
          env GOAMD64=v3 go build -v -trimpath -ldflags '-s -w' -o package-linux-glibc-x86-64-v3/ ./cmd/shadowsocks-go-domain-set-converter
          env CGO_ENABLED=0 GOAMD64=v2 go build -v -trimpath -ldflags '-s -w' -o package-linux-x86-64-v2/ ./cmd/shadowsocks-go-domain-set-converter
          env CGO_ENABLED=0 GOAMD64=v3 go build -v -trimpath -ldflags '-s -w' -o package-linux-x86-64-v3/ ./cmd/shadowsocks-go-domain-set-converter
          env CGO_ENABLED=0 GOARCH=arm64 go build -v -trimpath -ldflags '-s -w' -o package-linux-arm64/ ./cmd/shadowsocks-go-domain-set-converter

          env GOAMD64=v2 go build -v -trimpath -ldflags "${sstest_ldflags}" -o package-linux-glibc-x86-64-v2/ ./cmd/sstest
          env GOAMD64=v3 go build -v -trimpath -ldflags "${sstest_ldflags}" -o package-linux-glibc-x86-64-v3/ ./cmd/sstest
          env CGO_ENABLED=0 GOAMD64=v2 go build -v -trimpath -ldflags "${sstest_ldflags}" -o package-linux-x86-64-v2/ ./cmd/sstest
          env CGO_ENABLED=0 GOAMD64=v3 go build -v -trimpath -ldflags "${sstest_ldflags}" -o package-linux-x86-64-v3/ ./cmd/sstest
          env CGO_ENABLED=0 GOARCH=arm64 go build -v -trimpath -ldflags "${sstest_ldflags}" -o package-linux-arm64/ ./cmd/sstest

          for package_dir in package-*; do
            mkdir -p "${package_dir}/migrations/mysql"
            cp migrations/mysql/*.sql "${package_dir}/migrations/mysql/"
            cp LICENSE "${package_dir}/"
          done

      - name: Package
        env:
          ZSTD_CLEVEL: 19
          ZSTD_NBTHREADS: 0
        run: |
          cd package-linux-glibc-x86-64-v2/
          tar -acf ../shadowsocks-go-${{ github.ref_name }}-linux-glibc-x86-64-v2.tar.zst .
          cd ../package-linux-glibc-x86-64-v3/
          tar -acf ../shadowsocks-go-${{ github.ref_name }}-linux-glibc-x86-64-v3.tar.zst .
          cd ../package-linux-x86-64-v2/
          tar -acf ../shadowsocks-go-${{ github.ref_name }}-linux-x86-64-v2.tar.zst .
          cd ../package-linux-x86-64-v3/
          tar -acf ../shadowsocks-go-${{ github.ref_name }}-linux-x86-64-v3.tar.zst .
          cd ../package-linux-arm64/
          tar -acf ../shadowsocks-go-${{ github.ref_name }}-linux-arm64.tar.zst .

      - name: Upload verified release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages-${{ github.sha }}
          path: 'shadowsocks-go-*.tar.zst'
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packages-${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: 'shadowsocks-go-*.tar.zst'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" shadowsocks-go-*.tar.zst --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" shadowsocks-go-*.tar.zst --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${GITHUB_REF_NAME}"
          fi
