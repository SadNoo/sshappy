name: ${SSBAD_PROJECT_NAME:?set a unique project name for the explicitly approved node}

services:
  ssbad:
    image: ${SSBAD_IMAGE:?set an explicitly approved immutable offline candidate image; Node 3.3 is quarantined}
    pull_policy: ${SSBAD_PULL_POLICY:-never}
    platform: linux/amd64
    network_mode: host
    env_file:
      - ${SSBAD_ENV_FILE:?set a node-UUID-specific environment file}
    environment:
      FLYSKY_ENROLLMENT_TOKEN_PATH: /run/secrets/flysky/enrollment-token
      FLYSKY_MACHINE_CREDENTIAL_PATH: /var/lib/flysky/machine.json
      FLYSKY_SNAPSHOT_PATH: /var/lib/flysky/snapshot.json
      FLYSKY_SYNC_STATE_PATH: /var/lib/flysky/sync.json
      FLYSKY_REPORT_OUTBOX_PATH: /var/lib/flysky/reports.json
      UPSK_STORE_PATH: /var/lib/flysky/users.json
      UDP_MTU: "1600"
      UDP_OUTER_FRAGMENTATION: "true"
    volumes:
      - ${SSBAD_STATE_DIR:?set a fresh node-UUID-specific state directory}:/var/lib/flysky:rw
      - ${SSBAD_SECRET_DIR:?set a fresh node-UUID-specific secret directory}:/run/secrets/flysky:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "${SSBAD_RESTART_POLICY:-no}"
    stop_grace_period: 30s
